{% extends "base.html" %}
{% block title %}Join{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Join the library</h1>
  <p class="lede">Use at least 10 characters and avoid common passwords.</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include "accounts/_fields.html" %}
    <button type="submit" class="btn">Create account</button>
  </form>
  <p class="aside">Already a member? <a href="{% url 'accounts:login' %}">Sign in</a></p>
</section>
{% endblock %}
