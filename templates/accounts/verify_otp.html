{% extends "base.html" %}
{% block title %}Enter your code{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Check your email</h1>
  <p class="lede">We sent a 6-digit code to <strong>{{ email }}</strong>. It expires in 5 minutes.</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include "accounts/_fields.html" %}
    <button type="submit" class="btn">Verify and sign in</button>
  </form>
  <form method="post" action="{% url 'accounts:resend_otp' %}" class="aside">{% csrf_token %}
    <button type="submit" class="link">Send a new code</button>
    · <a href="{% url 'accounts:login' %}">Start over</a>
  </form>
</section>
{% endblock %}
