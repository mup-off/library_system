{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Reset your password</h1>
  <p class="lede">Enter your account email and we’ll send a reset link.</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include "accounts/_fields.html" %}
    <button type="submit" class="btn">Email me a reset link</button>
  </form>
</section>
{% endblock %}
