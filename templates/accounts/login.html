{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  <p class="lede">Enter your email and password. We’ll email you a one-time code to finish signing in.</p>
  <form method="post" novalidate>{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "accounts/_fields.html" %}
    <button type="submit" class="btn">Send my code</button>
  </form>
  <p class="aside"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a> · <a href="{% url 'accounts:register' %}">Create an account</a></p>
</section>
{% endblock %}
